name: Continuum live data-fabric contract
on:
  pull_request:
    paths:
      - 'src/integration/qualify-live-data-fabric.mjs'
      - 'src/integration/tests/qualify-live-data-fabric.test.mjs'
      - '.github/workflows/live-data-fabric-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify syntax
        run: node --check src/integration/qualify-live-data-fabric.mjs
      - name: Verify owner scope, existing SQLite and read-only boundaries
        run: node --test src/integration/tests/qualify-live-data-fabric.test.mjs
