# LEEWAY HEADER — DO NOT REMOVE
# REGION: LEEWAY.CONTINUUM.GITHUB_RECOVERY_HANDOFF.CI
# TAG: LEEWAY.CONTINUUM.OWNER_GITHUB_RECOVERY_SOURCE_QUALIFICATION.V1
# WHAT = Qualify tenant-owned GitHub recovery anchor handoff without accessing customers or replacing canonical Continuum.
# WHY = Require exact Formula, encrypted publish/readback and owner denial at source before production.
# WHO = Outside GPT-6 contributor; source CI is not independent Veritas.
# WHERE = .github/workflows/github-owner-recovery-source.yml
# WHEN = 2026-11-23.
# HOW = Read-only source checkout and Node test fixtures; no private keys, provider token or paid runtime.
# LICENSE = Repository MIT.
name: Continuum Owner GitHub Recovery Source
on:
  pull_request:
    paths:
      - 'src/integration/github-project-recovery-handoff.mjs'
      - 'src/integration/tests/github-project-recovery-handoff.test.mjs'
      - '.github/workflows/github-owner-recovery-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax
        run: |
          node --check src/integration/github-project-recovery-handoff.mjs
          node --check src/integration/tests/github-project-recovery-handoff.test.mjs
      - name: Owner, Formula, encrypted recovery and denial tests
        run: node --test src/integration/tests/github-project-recovery-handoff.test.mjs
